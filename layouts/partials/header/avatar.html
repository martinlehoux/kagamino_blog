{{ $avatar := resources.GetMatch .Site.Params.avatar }}
{{ $avatar = $avatar.Fill "160x160 q90" }}

<div class="avatar">
  <a href="{{ .Site.BaseURL }}">
    <img
      src="{{ $avatar.RelPermalink }}"
      width="{{ $avatar.Width }}"
      height="{{ $avatar.Height }}"
      alt="{{ .Site.Title }}"
    />
  </a>
</div>
